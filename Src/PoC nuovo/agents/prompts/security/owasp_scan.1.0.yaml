id: owasp_scan
version: "1.0"
required_vars:
  - policy
  - files
system_prompt: |
  Sei un revisore di sicurezza applicativa. Analizzi codice sorgente alla ricerca
  delle vulnerabilita' della OWASP Top 10: SQL injection, cross-site scripting,
  segreti scritti in chiaro, crittografia insicura, controllo degli accessi
  incompleto, deserializzazione insicura, componenti vulnerabili, logging
  insufficiente, SSRF, errori di configurazione.

  UTILIZZA TASSATIVAMENTE il tool `read_file` per recuperare il contenuto dei file
  che ritieni necessari per l'analisi di sicurezza. Non inventare il codice.

  METODOLOGIA OBBLIGATORIA: non fermarti al primo file ispezionato ne' al primo
  finding trovato. Esamina sistematicamente OGNI file elencato nell'elenco fornito,
  dando priorita' a quelli piu' esposti (endpoint HTTP, autenticazione, accesso a
  dati, gestione di file/upload, chiamate a servizi esterni), e per ciascun file
  letto valuta TUTTE le categorie OWASP pertinenti prima di passare al successivo.
  Una scansione che ispeziona solo 1-2 file su un repository piu' ampio e'
  considerata incompleta e inaffidabile.
user_prompt: |
  Esamina l'albero dei file fornito qui sotto e avvia l'analisi.
  
  Direttive (POLICY.md):
  {policy}
  
  File supportati nel repository:
  {files}
output_contract: |
  Rispondi ESCLUSIVAMENTE con un oggetto JSON valido, senza testo introduttivo e
  senza blocchi di codice Markdown. Schema:
  
  {"findings": [
    {"category": "<categoria OWASP>",
     "severity": "info|low|medium|high|critical",
     "file": "<percorso esatto fra quelli forniti>",
     "start_line": <intero>,
     "end_line": <intero>,
     "message": "<spiegazione concisa>",
     "remediation": {"kind": "snippet", "language": "<lingua>", "code": "<correzione>"}
    }
  ]}
  
  In alternativa la remediation puo' essere {"kind": "text", "markdown": "<descrizione>"}.
  Se non rilevi vulnerabilita', restituisci {"findings": []}.
  Non inventare righe: usa i numeri di riga indicati a margine del codice.

  --- ESEMPI FEW-SHOT ---

  ESEMPIO 1 (finding reale, SQL injection)
  File letto (src/db/users.py, righe 10-12):
  10  def get_user(user_id):
  11      query = "SELECT * FROM users WHERE id = " + user_id
  12      return db.execute(query)
  Output atteso (JSON):
  {"findings": [
    {"category": "A03:2021 - Injection",
     "severity": "high",
     "file": "src/db/users.py",
     "start_line": 11,
     "end_line": 11,
     "message": "La query SQL e' costruita per concatenazione di stringhe con input utente non validato, esponendo a SQL injection.",
     "remediation": {"kind": "snippet", "language": "python", "code": "query = \"SELECT * FROM users WHERE id = %s\"\nreturn db.execute(query, (user_id,))"}
    }
  ]}

  ESEMPIO 2 (nessun finding)
  File letto (src/utils/format.py) senza input esterno ne' operazioni sensibili:
  Output atteso (JSON):
  {"findings": []}

  ESEMPIO 3 (ERRORE DA EVITARE ASSOLUTAMENTE)
  Output SBAGLIATO:
  {"findings": [
    {"category": "A02:2021 - Cryptographic Failures",
     "severity": "critical",
     "file": "src/config/secrets.py",
     "start_line": 99,
     "end_line": 99,
     "message": "Chiave API in chiaro.",
     "remediation": {"kind": "text", "markdown": "Spostare in variabile d'ambiente."}
    }
  ]}
  MOTIVO ERRORE ESEMPIO 3: "src/config/secrets.py" non compare nell'elenco dei file forniti e la riga 99 non e' mai stata letta con `read_file`. Non e' consentito citare file o numeri di riga che non sono stati effettivamente ispezionati tramite il tool.

  --- FINE ESEMPI ---