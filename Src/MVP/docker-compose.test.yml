# Support services for the integration tests (pnpm test:integration).
#
# Ports intentionally different from docker-compose.yml: this way the suite
# can run while the development stack is up, without contending for ports
# and, most importantly, without writing to the development database.
#
# Compared to before: there was only Mongo (with root credentials no
# connection string used) and no Redis, while AppModule opens a
# BullMQ/Redis connection at startup and does not even start without it.
networks:
  codeguardian-test-net:
    driver: bridge

services:
  mongodb-test:
    image: mongo:7
    ports:
      - "27018:27017"
    networks:
      - codeguardian-test-net
    # No volume: the test database is throwaway, and restarting clean on
    # every run is exactly what we want.
    tmpfs:
      - /data/db
    healthcheck:
      test: echo "db.runCommand('ping').ok" | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    networks:
      - codeguardian-test-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-test:
    image: minio/minio
    ports:
      - "9002:9000"
    networks:
      - codeguardian-test-net
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
