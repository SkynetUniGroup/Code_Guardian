server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # API REST — stesso origin del frontend.
    #
    # apiClient (src/api/client.ts) chiama percorsi relativi (/api/v1/...)
    # perche' in produzione CloudFront sta davanti sia al frontend sia al
    # backend. In docker-compose quel ruolo lo fa questo nginx: senza questa
    # location il browser chiedeva /api/v1/... a nginx, che rispondeva con
    # index.html (SPA fallback) — nessuna chiamata al backend andava a segno,
    # e neanche una si vedeva come errore di rete.
    #
    # Passare per qui rende anche same-origin le richieste: nessun preflight
    # CORS da gestire lato browser.
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # L'export PDF di un report grande puo' metterci piu' del default.
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------------------------
    # Socket.IO — handshake HTTP + upgrade a WebSocket.
    #
    # useWebSocket si connette a io("/"), quindi il client parla con
    # /socket.io/ su questo stesso origin. Upgrade/Connection vanno inoltrati
    # esplicitamente, altrimenti la connessione resta in polling o cade.
    # ------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Una connessione realtime resta aperta a lungo senza traffico: senza
        # questo nginx la chiuderebbe dopo 60s e il client farebbe reconnect
        # in loop.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static assets — aggressive cache (content-hashed by Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
