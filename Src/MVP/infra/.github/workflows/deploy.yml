# Assumes the Code Guardian monorepo: Src/MVP/{frontend,backend,agents,infra}
# (this folder). Adapt the `working-directory` if the layout changes.
#
# The OIDC trust of codeguardian-ci-role accepts any branch/ref; it is the
# `if` conditions on individual steps below that restrict the use of AWS
# credentials to pushes on main only. On PRs only typecheck and local
# Docker build run.
name: Deploy Code Guardian

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write # required for OIDC authentication to AWS
  contents: read

env:
  AWS_REGION: eu-south-1
  ECR_BACKEND_REPO: codeguardian/backend
  ECR_AGENTS_REPO: codeguardian/agents

jobs:
  # Runs on every PR and push, without AWS credentials: catches trivial
  # errors (wrong imports, nonexistent CDK props) before even authenticating.
  typecheck-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: Src/MVP/infra
        run: |
          npm ci
          npx tsc --noEmit

  # Build images as a smoke test on every PR/push. The ECR push and
  # everything that requires AWS is restricted to the main branch (see
  # conditions on individual steps).
  build-images:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.vars.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "image-tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build backend image (no push)
        working-directory: Src/MVP/backend
        run: docker build -t codeguardian-backend:local .

      - name: Build agents image (no push)
        working-directory: Src/MVP/agents
        run: docker build -t codeguardian-agents:local .

      - name: Configure AWS credentials (OIDC, main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/codeguardian-ci-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push backend image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ steps.vars.outputs.image-tag }}"
          docker tag codeguardian-backend:local "$IMAGE"
          docker push "$IMAGE"

      - name: Push agents image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_AGENTS_REPO }}:${{ steps.vars.outputs.image-tag }}"
          docker tag codeguardian-agents:local "$IMAGE"
          docker push "$IMAGE"

  # Pre-deploy gate: `cdk synth` with real credentials, before touching
  # any resource. If the stack does not synthesize, the deploy does not start.
  synth-infra:
    needs: build-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure AWS credentials (OIDC, codeguardian-ci-role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/codeguardian-ci-role
          aws-region: ${{ env.AWS_REGION }}
      - working-directory: Src/MVP/infra
        run: |
          npm ci
          npx cdk synth --context imageTag=${{ needs.build-images.outputs.image-tag }}

  # New Task Definition revision + ECS service update. Reuses `cdk deploy`
  # (not `aws ecs update-service --force-new-deployment` alone) because
  # the image tag is part of the stack definition (imageTag context): a
  # new synth is needed to generate it.
  deploy-compute:
    needs: [build-images, synth-infra]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure AWS credentials (OIDC, codeguardian-ci-role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/codeguardian-ci-role
          aws-region: ${{ env.AWS_REGION }}
      - working-directory: Src/MVP/infra
        run: npm ci
      - working-directory: Src/MVP/infra
        run: |
          npx cdk deploy CodeGuardian-Compute \
            --context imageTag=${{ needs.build-images.outputs.image-tag }} \
            --require-approval never \
            --exclusively

  # Vite build, S3 sync, CloudFront invalidation.
  deploy-frontend:
    needs: [build-images, synth-infra]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure AWS credentials (OIDC, codeguardian-ci-role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/codeguardian-ci-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Build frontend (Vite, relative API URL)
        working-directory: Src/MVP/frontend
        env:
          # Relative path -- Same-Origin behind CloudFront, no CORS.
          VITE_API_BASE_URL: /api/v1
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Sync build to S3 (static frontend bucket)
        run: aws s3 sync Src/MVP/frontend/dist "s3://${{ secrets.FRONTEND_BUCKET_NAME }}" --delete

      - name: CloudFront cache invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
