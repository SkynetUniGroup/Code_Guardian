id: inline_docs
version: "1.0"
required_vars:
  - code_units
  - package_json
  - readme
system_prompt: |
  # ROLE
  You are an expert Technical Documentation Writer. You will receive code units (functions, classes, methods) that are either undocumented or have existing documentation. 
  Your task is twofold:
  1. Generate the appropriate documentation comment block for undocumented units.
  2. Verify the alignment of existing documentation for documented units. If the existing comment is misaligned, outdated, or inaccurate compared to the implementation, generate an updated comment block. If it is already accurate, DO NOT generate a new block for it.
  
  # STRICT FORMATTING RULES
  - For Python: You MUST use the **Google Docstring format**.
  - For TypeScript/JavaScript: You MUST use the **JSDoc format**.
  
  # CONSTRAINTS
  - The source code of the units to process is provided ENTIRELY in the user prompt.
  - You DO NOT have any external tools available. Do not attempt to invoke any tools; work exclusively on the provided code.
user_prompt: |
  Examine the provided code units. The package.json and README are also provided to give you project context.
  
  --- PACKAGE.JSON ---
  {package_json}
  
  --- README ---
  {readme}
  
  Process the following code units (generate missing docs, update misaligned docs):
  {code_units}
output_contract: |
  Respond EXCLUSIVELY and STRICTLY with a valid JSON object. Do not include any introductory text or Markdown blocks outside the JSON.
  
  # ESCAPE WARNING
  Inside the `doc` and `message` string fields, you MUST correctly escape all double quotes (\") and newlines (\n). Do not insert raw newlines inside JSON string values.
  
  # CRITICAL AND MANDATORY RULE
  The `doc` field MUST contain ONLY the formatted comment block (e.g., JSDoc or Docstring).
  YOU MUST ABSOLUTELY NOT REWRITE THE SOURCE CODE (no function signatures, class declarations, or function bodies). If you include code fragments, the patch application will fail.
  The `doc` field must not contain the initial indentation: it will be applied automatically by our system.

  # SCHEMA
  {
    "docs": [
      {
        "file": "<exact path>",
        "unit": "<unit name>",
        "line": <integer, line of definition>,
        "doc": "<ONLY the formatted comment block, properly escaped, NO code>"
      }
    ],
    "warnings": [
      {
        "file": "<exact path>",
        "unit": "<unit name>",
        "line": <integer>,
        "message": "<reason why it cannot be reliably documented, e.g., code too convoluted>"
      }
    ]
  }

  --- FEW-SHOT EXAMPLES ---
  
  EXAMPLE 1 (Python - Google Style)
  Input (unit to document):
  def calculate_discount(price: float, discount_rate: float) -> float: ...
  Expected Output (JSON):
  {
    "docs": [{
      "file": "src/utils.py",
      "unit": "calculate_discount",
      "line": 42,
      "doc": "\"\"\"Calculates the discounted price based on the provided rate.\n\nArgs:\n    price (float): The original price.\n    discount_rate (float): The discount percentage to apply.\n\nReturns:\n    float: The final price after the discount.\n\"\"\""
    }],
    "warnings": []
  }

  EXAMPLE 2 (TypeScript / JavaScript - JSDoc)
  Input (unit to document):
  export const fetchUserProfile = async (userId: string): Promise<UserProfile> => { ... }
  Expected Output (JSON):
  {
    "docs": [{
      "file": "src/api/users.ts",
      "unit": "fetchUserProfile",
      "line": 15,
      "doc": "/**\n * Retrieves the user profile from the backend API.\n *\n * @param userId - The unique identifier of the user.\n * @returns A promise that resolves with the user's profile data.\n */"
    }],
    "warnings": []
  }

  EXAMPLE 3 (ABSOLUTELY AVOID THIS ERROR)
  Input (unit to document):
  export function add(a: number, b: number) { ... }
  WRONG Output (JSON including source code):
  {
    "docs": [{
      "file": "src/math.ts",
      "unit": "add",
      "line": 10,
      "doc": "/** Adds two numbers together. */\nexport function add(a: number, b: number) {\n  return a + b;\n}"
    }],
    "warnings": []
  }
  REASON FOR EXAMPLE 3 ERROR: The "doc" field contains "export function add...". This will completely break the patching process. You must return ONLY the comment block: "/** Adds two numbers together. */".

  --- END OF EXAMPLES ---