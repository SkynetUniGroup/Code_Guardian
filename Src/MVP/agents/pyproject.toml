[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code_guardian_agents"
version = "1.0.0"
description = "Python agent service for Code Guardian (FastAPI + LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    # LangGraph + checkpointer MongoDB (main.py: AsyncMongoDBSaver)
    "langgraph>=0.2.20",
    # Tetto a <0.3 voluto: AsyncMongoDBSaver, che main.py costruisce da un
    # client async di pymongo, vive in `langgraph.checkpoint.mongodb.aio` fino
    # alla 0.2.2 ed e' stato rimosso nella 0.3.0. Senza il tetto pip prende
    # l'ultima (0.5.0) e il servizio muore all'import con ModuleNotFoundError.
    #
    # Debito con scadenza dichiarata, non una svista: la 0.5.0 offre i metodi
    # async su MongoDBSaver, ma sono la versione sincrona eseguita in un thread
    # pool e vogliono un client sincrono al posto di quello async. Migrare
    # significa cambiare anche quello, e va fatto con il servizio in piedi per
    # poterlo verificare.
    "langgraph-checkpoint-mongodb>=0.2.2,<0.3",
    # pymongo arriva con langgraph-checkpoint-mongodb; motor non c'e' piu'
    # perche' non lo usa piu' nessuno (vedi il commento in main.py) ed e'
    # deprecato da MongoDB in favore dell'API async di pymongo.
    # Provider LLM: OpenAI-compatible (Qwen/DashScope) e AWS Bedrock
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.8",
    "langchain-aws>=0.1.6",
    "boto3>=1.34.0",
    # Redis: flag di cancellazione cooperativa letto da graph._check_interrupts
    # e cache delle metriche SonarQube
    "redis[hiredis]>=5.0.4",
    # Analisi statica per l'agente Security. Invocato come sottoprocesso, non
    # come libreria: la dipendenza serve perche' il binario finisca nell'immagine.
    "semgrep>=1.80.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-mock>=3.14.0",
    "respx>=0.21.1",
    # pytest.ini passa `--cov=src --cov-fail-under=75` in addopts: senza
    # questo plugin pytest si ferma subito con "unrecognized arguments".
    "pytest-cov>=5.0.0",
    # Tetto a <0.16 voluto, non una svista.
    #
    # `ruff check` non ha `select` configurato, quindi usa l'insieme di regole
    # attivo per default in quella versione — e quell'insieme cambia fra una
    # versione e l'altra. Il codice qui passa pulito fino alla 0.15.x; dalla
    # 0.16.0 ruff attiva per default anche BLE001, SIM102/113, UP041 e RUF100,
    # e la CI (`python -m ruff check src/`) trova 17 segnalazioni senza che
    # nessuno abbia toccato una riga.
    #
    # Il vincolo era `>=0.3.0` senza limite superiore: la CI installava sempre
    # l'ultima, quindi le regole si allargavano da sole. Il tetto le congela a
    # quelle per cui il codice e' gia' conforme. Per alzarlo basta sistemare
    # quelle 17 — due sono automatiche con `--fix`, le altre toccano la
    # gestione delle eccezioni e vanno lette una per una.
    "ruff>=0.3.0,<0.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
