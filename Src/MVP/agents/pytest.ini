[pytest]
# Tests live in tests/, not in src/: with testpaths=src pytest would not
# collect any. Coverage is instead measured on src/, which is the code under
# test - in lowercase, because on Linux (where CI runs) the filesystem is
# case-sensitive and the 'Src' folder does not exist.
testpaths = tests
python_files = test_*.py
# The agent tests are almost all async: without this each one would have to
# be marked by hand, and it is the convention bedrock had already adopted.
asyncio_mode = auto
addopts = --cov=src --cov-report=term --cov-fail-under=75
