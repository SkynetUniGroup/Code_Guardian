name: PR Check
on:
  pull_request:
    branches: [ main, develop ]
jobs:
  check:
    runs-on: ubuntu-latest
    working-directory: Src/MVP
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dipendenze
        run: pnpm install

      - name: Linting
        run: pnpm lint

      - name: Test unitari
        run: pnpm test:unit

      - name: Test di integrazione
        run: |
          docker-compose -f docker-compose.test.yml up -d
          pnpm test:integration
          docker-compose -f docker-compose.test.yml down

      - name: Build
        run: pnpm build