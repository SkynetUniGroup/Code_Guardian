name: Release Production
on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Src/MVP
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # === Environment setup ===
      - name: Setup pnpm + Node.js
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true
          working-directory: Src/MVP
          require-lockfile: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: pip cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('Src/MVP/agents/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # === Node.js (backend/frontend) ===
      - name: Install Node.js dependencies
        run: pnpm install

      - name: Node.js linting
        run: pnpm lint

      - name: Node.js unit tests
        run: pnpm test:unit

      # === Python (agents) ===
      - name: Install Python dependencies
        working-directory: Src/MVP/agents
        run: pip install -r requirements.txt

      - name: Python linting
        working-directory: Src/MVP/agents
        run: python -m pylint .

      - name: Python unit tests
        working-directory: Src/MVP/agents
        run: python -m pytest

      # === Integration tests (both Python and Node.js) ===
      - name: Integration tests
        run: |
          docker-compose -f docker-compose.test.yml up -d
          pnpm test:integration:test
          cd agents && python -m pytest tests/integration/ -v
          docker-compose -f docker-compose.test.yml down

      - name: Build Node.js
        run: pnpm build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-south-1

      - name: Deploy frontend on S3
        run: |
          aws s3 sync ./dist s3://code-guardian-frontend --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      - name: Login Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        run: |
          docker build -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-south-1.amazonaws.com/code-guardian-backend:${{ github.ref_name }} .
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-south-1.amazonaws.com/code-guardian-backend:${{ github.ref_name }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-definition.json
          service: code-guardian-service
          cluster: code-guardian-cluster
          wait-for-service-stability: true